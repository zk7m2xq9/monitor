<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星遇直播监控 - 安全版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 14px; opacity: 0.9; }
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .refresh-btn:hover { background: white; color: #667eea; }
        .refresh-btn:active { transform: scale(0.95); }
        .status-summary { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .status-card {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 120px;
        }
        .status-card .number { font-size: 36px; font-weight: bold; margin-bottom: 5px; }
        .status-card .label { font-size: 14px; color: #666; }
        .status-card.live .number { color: #4CAF50; }
        .status-card.rest .number { color: #f44336; }
        .anchor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .anchor-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .anchor-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .anchor-card.live { border-left: 5px solid #4CAF50; }
        .anchor-card.rest { border-left: 5px solid #f44336; opacity: 0.85; }
        .anchor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .anchor-name { font-size: 24px; font-weight: bold; color: #333; }
        .live-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .live-badge.live { background: #4CAF50; color: white; animation: pulse 2s infinite; }
        .live-badge.rest { background: #f44336; color: white; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .anchor-links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f5f5f5;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .link-btn:hover { background: #e8e8e8; border-color: #667eea; }
        .link-btn .icon { font-size: 20px; margin-right: 10px; }
        .link-btn .text { flex: 1; }
        .link-btn .platform { font-size: 12px; color: #666; }
        .note { margin-top: 12px; padding: 10px; background: #fff3cd; border-radius: 8px; font-size: 13px; color: #856404; }
        .no-note { margin-top: 12px; padding: 10px; background: #d4edda; border-radius: 8px; font-size: 13px; color: #155724; }
        .update-time { margin-top: 10px; font-size: 11px; color: #999; text-align: right; }
        .loading { text-align: center; color: white; font-size: 18px; padding: 40px; }
        .error { background: #f44336; color: white; padding: 20px; border-radius: 10px; text-align: center; margin: 20px 0; }
        .last-update { text-align: center; color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 20px; }
        @media (max-width: 480px) {
            .anchor-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 星遇直播监控</h1>
            <p>安全版 - 手动刷新，避免频繁请求</p>
            <button class="refresh-btn" onclick="fetchData()">🔄 点击刷新数据</button>
        </div>
        
        <div class="status-summary" id="statusSummary">
            <div class="loading">点击上方按钮加载数据</div>
        </div>
        
        <div class="anchor-grid" id="anchorGrid">
            <div class="loading">等待刷新...</div>
        </div>
        
        <div class="last-update" id="lastUpdate"></div>
    </div>

    <script>
        // 配置
        const API_URL = "https://zhibo.bbnhy.cn/prod-api/system/detail/listH5?pageNum=1&pageSize=50";
        const VIEWER_ID = "17965449772";
        const nameMap = {23: "黎黎", 25: "晶晶", 26: "圆圆", 30: "星星", 32: "冰冰", 31: "昭昭"};
        const restKeywords = ['休息', '停播', '没法播', '姨妈', '感冒', '嗓子', '不舒服', '医院'];
        
        let lastFetchTime = null;
        
        async function fetchData() {
            const summaryDiv = document.getElementById('statusSummary');
            const gridDiv = document.getElementById('anchorGrid');
            const lastUpdateDiv = document.getElementById('lastUpdate');
            
            summaryDiv.innerHTML = '<div class="loading">🔄 正在获取数据...</div>';
            gridDiv.innerHTML = '<div class="loading">请稍候...</div>';
            
            try {
                // 添加随机延迟，模拟真人操作
                await new Promise(resolve => setTimeout(resolve, Math.random() * 500 + 300));
                
                const response = await fetch(API_URL, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('网络请求失败: ' + response.status);
                }
                
                const data = await response.json();
                
                // 再次延迟，模拟阅读时间
                await new Promise(resolve => setTimeout(resolve, Math.random() * 300 + 200));
                
                displayData(data.rows || []);
                
                lastFetchTime = new Date();
                lastUpdateDiv.textContent = `最后刷新: ${lastFetchTime.toLocaleString()}`;
                
            } catch (error) {
                summaryDiv.innerHTML = `<div class="error">❌ 获取数据失败: ${error.message}<br><small>可能是Token过期或网络问题</small></div>`;
                gridDiv.innerHTML = '';
            }
        }
        
        function displayData(rows) {
            const anchors = [];
            let liveCount = 0;
            let restCount = 0;
            
            for (const row of rows) {
                const aid = row.anchorId;
                if (!nameMap[aid]) continue;
                
                const info = {
                    id: aid,
                    name: nameMap[aid],
                    dy_url: '',
                    ks_url: '',
                    meeting_url: '',
                    svip_url: '',
                    svip_note: row.name || '',
                    update_time: row.updateTime || '',
                    is_live: false
                };
                
                for (const r of row.anchorResourceList || []) {
                    const rt = r.resourceType;
                    if (rt === '直播地址') {
                        const url = r.resourceUrl || '';
                        if (url.includes('douyin.com')) {
                            info.dy_url = url.split('\n')[0];
                        }
                        if (url.includes('kuaishou.com')) {
                            info.ks_url = url.split('\n').find(u => u.includes('kuaishou.com')) || '';
                        }
                    } else if (rt === '第二视角') {
                        info.meeting_url = r.resourceName || '';
                    } else if (rt === 'SVIP直播') {
                        info.svip_url = `https://zhibo.bbnhy.cn/#/pages/live/gift-test?roomId=${aid}&viewerId=${VIEWER_ID}&userName=游客&anchorName=${encodeURIComponent(row.name || '')}`;
                    }
                }
                
                // 判断是否在直播
                const isResting = restKeywords.some(kw => info.svip_note.includes(kw));
                info.is_live = (info.dy_url || info.ks_url) && !isResting;
                
                if (info.is_live) liveCount++;
                else restCount++;
                
                anchors.push(info);
            }
            
            // 显示统计
            const summaryDiv = document.getElementById('statusSummary');
            summaryDiv.innerHTML = `
                <div class="status-card live">
                    <div class="number">${liveCount}</div>
                    <div class="label">🟢 直播中</div>
                </div>
                <div class="status-card rest">
                    <div class="number">${restCount}</div>
                    <div class="label">🔴 休息中</div>
                </div>
                <div class="status-card">
                    <div class="number">${anchors.length}</div>
                    <div class="label">总主播数</div>
                </div>
            `;
            
            // 显示主播卡片
            const gridDiv = document.getElementById('anchorGrid');
            gridDiv.innerHTML = anchors.map(a => createAnchorCard(a)).join('');
        }
        
        function createAnchorCard(anchor) {
            const statusClass = anchor.is_live ? 'live' : 'rest';
            const statusText = anchor.is_live ? '🟢 直播中' : '🔴 休息中';
            
            let linksHtml = '';
            
            if (anchor.dy_url) {
                linksHtml += `
                    <a href="${anchor.dy_url}" target="_blank" class="link-btn">
                        <span class="icon">🎵</span>
                        <span class="text">抖音直播</span>
                        <span class="platform">点击观看</span>
                    </a>
                `;
            }
            
            if (anchor.ks_url) {
                linksHtml += `
                    <a href="${anchor.ks_url}" target="_blank" class="link-btn">
                        <span class="icon">📱</span>
                        <span class="text">快手直播</span>
                        <span class="platform">点击观看</span>
                    </a>
                `;
            }
            
            if (anchor.meeting_url) {
                linksHtml += `
                    <a href="${anchor.meeting_url}" target="_blank" class="link-btn">
                        <span class="icon">📹</span>
                        <span class="text">第二视角</span>
                        <span class="platform">Zoom会议</span>
                    </a>
                `;
            }
            
            if (anchor.svip_url) {
                linksHtml += `
                    <a href="${anchor.svip_url}" target="_blank" class="link-btn">
                        <span class="icon">⭐</span>
                        <span class="text">SVIP直播</span>
                        <span class="platform">专属</span>
                    </a>
                `;
            }
            
            const noteHtml = anchor.svip_note && anchor.svip_note !== anchor.name
                ? `<div class="note">📝 ${anchor.svip_note}</div>`
                : '<div class="no-note">✨ 正常直播中</div>';
            
            return `
                <div class="anchor-card ${statusClass}">
                    <div class="anchor-header">
                        <div class="anchor-name">${anchor.name}</div>
                        <div class="live-badge ${statusClass}">${statusText}</div>
                    </div>
                    <div class="anchor-links">
                        ${linksHtml || '<p style="color: #999; text-align: center;">暂无直播链接</p>'}
                    </div>
                    ${noteHtml}
                    <div class="update-time">更新: ${anchor.update_time}</div>
                </div>
            `;
        }
        
        // 页面加载时不自动获取，等待用户点击
        document.getElementById('lastUpdate').textContent = '点击上方按钮开始监控';
    </script>
</body>
</html>
